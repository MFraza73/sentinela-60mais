name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright e Chromium (para o gerador da imagem)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Rodar os testes de regressão
        run: python testes/rodar_testes.py
